    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    #splashScreen { transition: opacity 0.4s ease-out, visibility 0.4s ease-out; }
    .fade-out { opacity: 0 !important; visibility: hidden !important; pointer-events: none; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex justify-center antialiased selection:bg-amber-500 selection:text-zinc-950">

  <div id="splashScreen" class="fixed inset-0 z-50 bg-zinc-950 flex flex-col items-center justify-center p-6 text-center">
    <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-amber-600 to-amber-400 text-zinc-950 font-black flex items-center justify-center text-3xl shadow-xl shadow-amber-500/20 ring-4 ring-amber-500/20 mb-5 animate-pulse">
      GO

    <h1 class="text-2xl font-black tracking-tight uppercase text-zinc-100 mb-1">Golden Palace Restaurant</h1>

    <div class="mt-8 flex items-center gap-2 text-[11px] text-zinc-500 font-mono">
      <i class="fa-solid fa-circle-notch fa-spin text-amber-500 text-xs"></i>
      <span>Loading menu...</span>
    </div>
  </div>

  <div class="w-full max-w-md min-h-screen bg-zinc-950 border-x border-zinc-900 flex flex-col relative shadow-2xl pb-16">
    <header class="sticky top-0 z-40 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-400 text-zinc-950 font-black flex items-center justify-center text-sm shadow-md">
          GO
        </div>
        <div>
          <h1 class="font-bold text-sm text-zinc-100 leading-tight uppercase">Golden Palace Restaurant</h1>
          <p class="text-[11px] text-amber-400/80 font-medium">Touchless Menu</p>
        </div>
      </div>
      <button onclick="shareMenu()" class="w-9 h-9 rounded-xl bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 active:scale-95 flex items-center justify-center text-zinc-300 transition cursor-pointer">
        <i class="fa-solid fa-arrow-up-from-bracket text-xs"></i>
      </button>
    </header>

    <div class="px-4 mt-3 space-y-2.5">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-zinc-500 text-xs"></i>
        <input type="text" id="searchInput" oninput="filterDishes()" placeholder="Search dishes..." 
          class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl py-2 pl-9 pr-8 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-amber-500 transition">
        <button onclick="clearSearch()" id="clearBtn" class="hidden absolute right-3 top-2.5 text-zinc-500 hover:text-zinc-300 text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="flex gap-2">
        <button onclick="setDietFilter('all')" id="diet-all" class="diet-btn text-[11px] font-bold px-3 py-1.5 rounded-lg border border-amber-500/40 bg-amber-500/10 text-amber-400 transition cursor-pointer">All</button>
        <button onclick="setDietFilter('veg')" id="diet-veg" class="diet-btn text-[11px] font-semibold px-3 py-1.5 rounded-lg border border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-emerald-400 transition flex items-center gap-1.5 cursor-pointer">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Veg
        </button>
        <button onclick="setDietFilter('nonveg')" id="diet-nonveg" class="diet-btn text-[11px] font-semibold px-3 py-1.5 rounded-lg border border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-rose-400 transition flex items-center gap-1.5 cursor-pointer">
          <span class="w-2 h-2 rounded-full bg-rose-500"></span> Non-Veg
        </button>
      </div>
    </div>

    <div class="flex gap-1.5 px-4 mt-3 overflow-x-auto no-scrollbar py-1" id="categoryPills"></div>
    <main class="px-4 mt-3 space-y-4 flex-1" id="menuContainer"></main>

    <footer class="text-center py-6 text-[10px] text-zinc-600 uppercase tracking-widest font-semibold">
      Digital Menu • Golden Palace Restaurant
    </footer>
  </div>

    let currentCategory = "All";
    let currentDiet = "all";

    function initCategories() {
      const categories = ["All", ...new Set(MENU_ITEMS.map(i => i.category))];
      const pillsDiv = document.getElementById("categoryPills");
      pillsDiv.innerHTML = categories.map(cat => `
        <button onclick="selectCategory('${cat}')" id="cat-btn-${cat.replace(/\s+/g, '-')}" 
          class="cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer active:scale-95 ${cat === 'All' ? 'bg-amber-500 text-zinc-950 font-bold' : 'bg-zinc-900 border border-zinc-800 text-zinc-300'}">
          ${cat}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-pill").forEach(el => {
        el.className = "cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer active:scale-95 bg-zinc-900 border border-zinc-800 text-zinc-300";
      });
      const activeBtn = document.getElementById(`cat-btn-${cat.replace(/\s+/g, '-')}`);
      if (activeBtn) activeBtn.className = "cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer active:scale-95 bg-amber-500 text-zinc-950";
      filterDishes();
    }

    function setDietFilter(type) {
      currentDiet = type;
      document.querySelectorAll(".diet-btn").forEach(el => {
        el.className = "diet-btn text-[11px] font-semibold px-3 py-1.5 rounded-lg border border-zinc-800 bg-zinc-900 text-zinc-400 transition flex items-center gap-1.5 cursor-pointer";
      });
      const active = document.getElementById(`diet-${type}`);
      if (type === 'all') active.className = "diet-btn text-[11px] font-bold px-3 py-1.5 rounded-lg border border-amber-500/40 bg-amber-500/10 text-amber-400 transition cursor-pointer";
      if (type === 'veg') active.className = "diet-btn text-[11px] font-bold px-3 py-1.5 rounded-lg border border-emerald-500/40 bg-emerald-500/10 text-emerald-400 transition flex items-center gap-1.5 cursor-pointer";
      if (type === 'nonveg') active.className = "diet-btn text-[11px] font-bold px-3 py-1.5 rounded-lg border border-rose-500/40 bg-rose-500/10 text-rose-400 transition flex items-center gap-1.5 cursor-pointer";
      filterDishes();
    }

    function clearSearch() {
      const input = document.getElementById("searchInput");
      input.value = "";
      document.getElementById("clearBtn").classList.add("hidden");
      filterDishes();
    }

    function filterDishes() {
      const input = document.getElementById("searchInput");
      const query = input.value.toLowerCase().trim();
      document.getElementById("clearBtn").classList.toggle("hidden", query.length === 0);

      const filtered = MENU_ITEMS.filter(item => {
        const matchesCat = currentCategory === "All" || item.category === currentCategory;
        const matchesDiet = currentDiet === "all" || (currentDiet === "veg" && item.isVeg) || (currentDiet === "nonveg" && !item.isVeg);
        const matchesQuery = !query || item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query);
        return matchesCat && matchesDiet && matchesQuery;
      });

      const container = document.getElementById("menuContainer");
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-zinc-500">
            <i class="fa-solid fa-utensils text-2xl mb-2 text-zinc-700"></i>
            <p class="text-xs">No matching dishes found</p>
          </div>`;
        return;
      }

      container.innerHTML = "";

      // Group by categories
      const categoriesToRender = currentCategory === "All" 
        ? [...new Set(filtered.map(i => i.category))]
        : [currentCategory];

      categoriesToRender.forEach(cat => {
        const catItems = filtered.filter(i => i.category === cat);
        if (catItems.length === 0) return;

        let sectionHtml = `
          <div class="space-y-2">
            <div class="flex items-center gap-2 pt-1 pb-0.5">
              <span class="w-1.5 h-3.5 bg-amber-500 rounded-full"></span>
              <h2 class="text-xs font-black uppercase tracking-wider text-amber-400">${cat}</h2>
              <span class="text-[10px] text-zinc-500 font-semibold">(${catItems.length})</span>
            </div>
        `;

        sectionHtml += catItems.map(item => `
          <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-3 flex justify-between items-center gap-3 shadow-sm hover:border-zinc-700/80 transition">
            <div class="flex-1 pr-2">
              <div class="flex items-center gap-2">
                <span class="inline-flex items-center justify-center w-3.5 h-3.5 border ${item.isVeg ? 'border-emerald-500' : 'border-rose-500'} p-0.5 rounded-xs shrink-0">
                  <span class="w-1.5 h-1.5 rounded-full ${item.isVeg ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                </span>
                <h3 class="font-medium text-xs text-zinc-100">${item.name}</h3>
              </div>
            </div>
            <div class="font-bold text-amber-400 text-xs whitespace-nowrap bg-zinc-950/80 px-2.5 py-1.5 rounded-xl border border-zinc-800/60">
              ₹${item.price}/-
            </div>
          </div>
        `).join('');

        sectionHtml += `</div>`;
        container.innerHTML += sectionHtml;
      });
    }

    function shareMenu() {
      if (navigator.share) {
        navigator.share({ title: "Golden Palace Restaurant Menu", url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copied to clipboard!");
      }
    }

    initCategories();
    filterDishes();
  </script>
