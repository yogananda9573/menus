<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deccan Flames - Digital Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding-bottom: 50px; }
        .header { background: linear-gradient(135deg, #e11d48, #be123c); padding: 30px 20px; text-align: center; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
        .header h1 { font-size: 24px; font-weight: 700; color: #fff; }
        .header p { font-size: 13px; color: #fecdd3; margin-top: 4px; }
        .container { max-width: 540px; margin: 20px auto; padding: 0 16px; }
        .category-block { margin-bottom: 22px; }
        .category-title { font-size: 17px; font-weight: 600; color: #fda4af; margin-bottom: 10px; border-left: 4px solid #e11d48; padding-left: 8px; }
        .items-list { background: #1e293b; border-radius: 16px; padding: 6px 14px; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #334155; }
        .menu-item:last-child { border-bottom: none; }
        .item-left { display: flex; align-items: center; gap: 10px; }
        .item-title { font-size: 15px; font-weight: 500; color: #f1f5f9; }
        .item-price { font-size: 15px; font-weight: 600; color: #38bdf8; }
        .footer { text-align: center; font-size: 12px; color: #64748b; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Deccan Flames</h1>
        <p>✨ SCAN & VIEW • FRESH TASTE FAST ✨</p>
    </div>
    <div class="container">
        
        <div class="category-block">
            <h2 class="category-title">Popular Specials</h2>
            <div class="items-list">
            <div class="menu-item">
                <div class="item-left">
                    <span class="veg-badge">🔴</span>
                    <span class="item-title">3.0 (10)</span>
                </div>
                <div class="item-price">₹199</div>
            </div>
            
            <div class="menu-item">
                <div class="item-left">
                    <span class="veg-badge">🔴</span>
                    <span class="item-title">₹110</span>
                </div>
                <div class="item-price">₹169</div>
            </div>
            
            <div class="menu-item">
                <div class="item-left">
                    <span class="veg-badge">🔴</span>
                    <span class="item-title">₹120</span>
                </div>
                <div class="item-price">₹185</div>
            </div>
            </div>
        </div>
        
        <div class="footer">Powered by Digital QR Menu Engine</div>
    </div>
</body>
</html>
